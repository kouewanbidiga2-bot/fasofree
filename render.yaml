# ============================================================
# FasoFree - Blueprint Render (render.yaml)
# Déploiement : API NestJS (Docker) + Console Admin (Vite) + App Client (Vite)
#
# AU PREMIER DÉPLOIEMENT :
#   1. Créez les 3 services via "New > Blueprint" dans Render
#   2. Les variables marquées `sync: false` sont à saisir dans le dashboard
#      Render (Service > Environment) AVANT la 1re build :
#        - DATABASE_URL       (ex: postgres://...?sslmode=require  - Neon)
#        - JWT_SECRET         (min 32 caractères)
#        - FIREBASE_*         (projet, client_email, private_key)
#        - REDIS_URL          (optionnel, Upstash recommandé)
#   3. Les migrations TypeORM s'exécutent au boot (DB_MIGRATIONS_RUN=true).
#      synchronize est INTERDIT en production (géré par le code).
# ============================================================

services:
  # ---------------- API BACKEND (NestJS via Docker) ----------------
  - type: web
    name: fasofree-api
    runtime: docker
    plan: free
    dockerfilePath: ./fasofree-backend/Dockerfile
    dockerContext: ./fasofree-backend
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "1000"
      - key: CORS_ORIGIN
        value: https://fasofree-admin.onrender.com,https://fasofree-client.onrender.com
      # synchronize interdit en prod (le code l'impose); les migrations gèrent le schéma.
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_MIGRATIONS_RUN
        value: "true"
      - key: PAYMENT_ENV
        value: sandbox
      - key: PAYMENT_PROVIDER
        value: mock
      - key: FASOFREE_COMMISSION_RATE
        value: "0.0085"
      - key: FASOFREE_COMMISSION_PAYER
        value: CLIENT
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # ---------------- CONSOLE ADMIN (dashboard) ----------------
  - type: web
    name: fasofree-admin
    runtime: node
    plan: free
    rootDir: fasofree-frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l 10000
    envVars:
      - key: VITE_API_URL
        value: https://fasofree-3nh8.onrender.com/api/v1

  # ---------------- APPLICATION CLIENT ----------------
  - type: web
    name: fasofree-client
    runtime: node
    plan: free
    rootDir: fasofree-frontend-client
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l 10000
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fasofree-3nh8.onrender.com/api/v1
