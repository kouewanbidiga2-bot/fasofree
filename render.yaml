# ============================================================
# FasoFree - Blueprint Render (render.yaml)
# Déploiement : API NestJS (Docker) uniquement
# Les frontends (admin + client) sont sur Vercel.
#
# AU PREMIER DÉPLOIEMENT :
#   1. Créez le service via "New > Blueprint" dans Render
#   2. Les variables marquées `sync: false` sont à saisir dans le dashboard
#      Render (Service > Environment) AVANT la 1re build :
#        - DATABASE_URL       (ex: postgres://...?sslmode=require  - Neon)
#        - JWT_SECRET         (min 32 caractères)
#        - FIREBASE_*         (projet, client_email, private_key)
#        - REDIS_URL          (optionnel, Upstash recommandé)
#        - GENIUSPAY_*        (clés API paiement)
#        - CLOUDINARY_*       (uploads images)
#   3. Les migrations TypeORM s'exécutent au boot (DB_MIGRATIONS_RUN=true).
#      synchronize est INTERDIT en production (géré par le code).
# ============================================================

services:
  # ---------------- API BACKEND (NestJS via Docker) ----------------
  - type: web
    name: fasofree-api
    runtime: docker
    plan: free
    dockerfilePath: ./fasofree-backend/Dockerfile
    dockerContext: ./fasofree-backend
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # Frontends réellement déployés sur Vercel (domaines custom).
      # Les aperçus *.vercel.app sont couverts par la regex de main.ts.
      - key: CORS_ORIGIN
        value: https://fasofree.site,https://www.fasofree.site,https://admin.fasofree.site
      # synchronize interdit en prod (le code l'impose); les migrations gèrent le schéma.
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_MIGRATIONS_RUN
        value: "true"
      # GeniusPay est le SEUL provider de paiement (payin + payout).
      - key: PAYMENT_ENV
        value: sandbox
      - key: FASOFREE_COMMISSION_RATE
        value: "0.0085"
      - key: FASOFREE_COMMISSION_PAYER
        value: CLIENT
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Frontends déployés sur Vercel (pas sur Render).
      - key: CLIENT_URL
        value: https://fasofree.site
      - key: ADMIN_URL
        value: https://admin.fasofree.site
      # GeniusPay (paiements)
      - key: GENIUSPAY_API_KEY
        sync: false
      - key: GENIUSPAY_API_SECRET
        sync: false
      - key: GENIUSPAY_WEBHOOK_SECRET
        sync: false
      # Cloudinary (uploads images)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # WhatsApp Cloud API (notifications)
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Email transactionnel
      - key: RESEND_API_KEY
        sync: false
      # Monitoring
      - key: SENTRY_DSN
        sync: false
