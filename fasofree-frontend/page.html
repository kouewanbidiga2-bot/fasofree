<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faso Free — L'art de la table</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: Georgia, 'Times New Roman', serif;
  background: #0C0A08;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 40px;
  padding: 24px;
}
.mask {
  width: 120px;
  height: 120px;
}
.dots {
  display: flex;
  gap: 10px;
  align-items: center;
  height: 12px;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #C4A574;
  animation: bounce 1.4s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
.tagline {
  font-size: 13px;
  font-weight: 300;
  font-style: italic;
  color: #8B7355;
  letter-spacing: 5px;
  text-transform: uppercase;
  opacity: 0.9;
  text-align: center;
}
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
  40% { transform: translateY(-10px); opacity: 1; }
}
</style>
<base target="_blank">
</head>
<body>

<svg class="mask" viewBox="0 0 140 140" fill="none">
  <ellipse cx="70" cy="70" rx="44" ry="52" stroke="#C4A574" stroke-width="2" fill="none"/>
  <path d="M38 50 Q70 22 102 50" stroke="#C4A574" stroke-width="1.5" fill="none" opacity="0.6"/>
  <line x1="70" y1="22" x2="70" y2="38" stroke="#C4A574" stroke-width="1" opacity="0.4"/>
  <path d="M50 62 Q58 56 66 62 Q58 68 50 62Z" fill="#C4A574" opacity="0.85"/>
  <path d="M74 62 Q82 56 90 62 Q82 68 74 62Z" fill="#C4A574" opacity="0.85"/>
  <path d="M70 62 L64 84 L76 84 Z" fill="#8B7355" opacity="0.7"/>
  <path d="M56 96 Q70 104 84 96" stroke="#C4A574" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <line x1="46" y1="78" x2="54" y2="78" stroke="#C4A574" stroke-width="0.8" opacity="0.3"/>
  <line x1="86" y1="78" x2="94" y2="78" stroke="#C4A574" stroke-width="0.8" opacity="0.3"/>
  <circle cx="70" cy="70" r="3" fill="#C4A574" opacity="0.2"/>
</svg>

<div class="dots">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<div class="tagline">L'art de la table</div>

</body>
</html>
