
services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: fasofree_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fasofree_db}
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: fasofree_redis
    ports:
      - "6379:6379"
