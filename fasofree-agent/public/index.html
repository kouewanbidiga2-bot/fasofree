<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FasoFree Launcher - conseiller IA du lancement FasoFree">
  <title>FasoFree Launcher</title>
  <link rel="icon" type="image/svg+xml" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0c0b0a;
      --bg-mid: #060505;
      --panel: #0a0807;
      --panel-2: #141110;
      --panel-3: #1c1715;
      --line: rgba(240, 237, 232, 0.08);
      --line-strong: rgba(240, 237, 232, 0.16);
      --accent: #C1652E;
      --accent-deep: #A85526;
      --text: #F0EDE8;
      --text-dim: #B8B0A4;
      --text-faint: #9B9286;
      --radius-panel: 26px;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "Roboto", -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: #000000;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 10px;
      background: var(--accent);
      color: #fff;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      z-index: 20;
    }
    .skip-link:focus { left: 10px; }

    .app {
      position: relative;
      display: flex;
      align-items: stretch;
      gap: 16px;
      max-width: 1180px;
      height: calc(100dvh - 48px);
      margin: 24px auto;
      padding-left: 8px;
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: visible;
      box-shadow: none;
    }

    /* ---------- Barre laterale : pilule flottante ---------- */
    .rail {
      flex: 0 0 auto;
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 9px;
      background: linear-gradient(180deg, #171716, #0e0e0d);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .rail-logo {
      width: 34px;
      height: 34px;
      margin-bottom: 14px;
    }

    .rail-btn {
      position: relative;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      color: var(--text-faint);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.15s, border-color 0.2s, box-shadow 0.25s;
    }

    .rail-btn svg { width: 20px; height: 20px; }

    .rail-btn:hover { background: rgba(193, 101, 46, 0.16); color: var(--text); }
    .rail-btn:active { transform: scale(0.94); }

    .rail-btn.active {
      background: linear-gradient(180deg, rgba(193, 101, 46, 0.3), rgba(193, 101, 46, 0.12));
      border-color: rgba(193, 101, 46, 0.75);
      color: #fff;
      box-shadow: 0 0 16px rgba(193, 101, 46, 0.5), inset 0 0 10px rgba(193, 101, 46, 0.18);
    }

    /* Accent vertical lumineux hors de la pilule (style Iconsax) */
    .rail-btn.active::before {
      content: "";
      position: absolute;
      left: -14px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 20px;
      border-radius: 3px;
      background: #D9753E;
      box-shadow: 0 0 10px rgba(217, 117, 62, 0.9);
    }

    .rail-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .rail-spacer { flex: 1; }

    /* ---------- Zone principale : panneau arrondi flottant ---------- */
    .main {
      position: relative;
      z-index: 0;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 18px 26px 22px;
      background: linear-gradient(170deg, #111110, #0a0a09);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    /* Lueur interne qui derive lentement derriere le contenu */
    .main::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(640px 340px at 82% -8%, rgba(193, 101, 46, 0.1), transparent 62%),
        radial-gradient(520px 320px at 6% 108%, rgba(212, 175, 55, 0.06), transparent 60%);
      animation: auroraMain 30s ease-in-out infinite alternate;
    }

    @keyframes auroraMain {
      from { transform: translate3d(0, 0, 0); opacity: 0.75; }
      to { transform: translate3d(-3%, 4%, 0); opacity: 1; }
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .brand-name {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-dim);
    }

    .brand-name strong { color: var(--text); font-weight: 700; }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #status {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-faint);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 13px;
      white-space: nowrap;
      transition: color 0.25s, border-color 0.25s;
    }

    #status.ok { color: #D9753E; border-color: rgba(193, 101, 46, 0.5); }
    #status.ko { color: #F59E0B; border-color: rgba(232, 182, 76, 0.4); }

    #newChatBtn {
      display: none;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-dim);
      background: transparent;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    #newChatBtn:hover { background: rgba(255, 255, 255, 0.06); color: var(--text); }

    body[data-view="chat"] #newChatBtn { display: inline-block; }

    /* ---------- Ecran d'accueil (launcher) ---------- */
    #hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: clamp(16px, 5vh, 52px) 0 8px;
    }

    .hero-logo {
      position: relative;
      z-index: 0;
      width: clamp(96px, 14vh, 132px);
      height: clamp(96px, 14vh, 132px);
      border-radius: 50%;
      box-shadow:
        0 0 0 6px rgba(193, 101, 46, 0.1),
        0 0 40px rgba(193, 101, 46, 0.18),
        0 18px 45px rgba(0, 0, 0, 0.5);
      margin-bottom: 26px;
    }

    .hero-mask { display: block; width: 100%; height: 100%; border-radius: 50%; }
    .hm-spark { opacity: 0; }

    /* Aureole vivante derriere le masque (pulsee en GSAP) */
    .hero-glow {
      position: absolute;
      inset: -32%;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(193, 101, 46, 0.34), rgba(193, 101, 46, 0.08) 55%, transparent 78%);
      pointer-events: none;
    }

    .hero-greeting {
      margin: 0;
      font-size: clamp(1.4rem, 3.2vw, 1.9rem);
      font-weight: 400;
      color: #CFC4B4;
      letter-spacing: -0.01em;
    }

    .hero-title {
      margin: 6px 0 0;
      font-size: clamp(1.55rem, 3.6vw, 2.15rem);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      text-wrap: balance;
      background-image: linear-gradient(100deg, var(--text) 35%, #FFE2C8 48%, #E9B989 52%, var(--text) 65%);
      background-size: 260% 100%;
      background-position: 100% 0;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleSheen 8s ease-in-out infinite;
    }

    @keyframes titleSheen {
      0%, 55%, 100% { background-position: 100% 0; }
      30% { background-position: -30% 0; }
    }

    .hero-sub {
      margin: 14px 0 0;
      max-width: 460px;
      font-size: 0.88rem;
      line-height: 1.55;
      color: #BDB0A0;
    }

    /* ---------- Champ de saisie : pilule a bordure lumineuse ---------- */
    .composer {
      width: 100%;
      max-width: 680px;
      margin: 26px auto 0;
      background:
        linear-gradient(#141413, #141413) padding-box,
        linear-gradient(120deg, rgba(193, 101, 46, 0.85), rgba(212, 175, 55, 0.35) 45%, rgba(193, 101, 46, 0.28)) border-box;
      border: 1px solid transparent;
      border-radius: 26px;
      padding: 14px 14px 10px;
      box-shadow: 0 0 22px rgba(193, 101, 46, 0.16), 0 0 50px rgba(193, 101, 46, 0.07);
      animation: composerGlow 4.5s ease-in-out infinite;
    }

    @keyframes composerGlow {
      0%, 100% { box-shadow: 0 0 22px rgba(193, 101, 46, 0.16), 0 0 50px rgba(193, 101, 46, 0.07); }
      50% { box-shadow: 0 0 32px rgba(193, 101, 46, 0.3), 0 0 68px rgba(193, 101, 46, 0.13); }
    }

    textarea {
      width: 100%;
      min-height: 74px;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.5;
      resize: none;
      padding: 4px 6px;
    }

    textarea::placeholder { color: var(--text-faint); }
    textarea:focus { outline: none; }

    .composer-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .mini-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 6px 13px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .mini-chip svg { width: 13px; height: 13px; flex: 0 0 auto; }

    .mini-chip:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(193, 101, 46, 0.5);
      color: var(--text);
    }

    .composer-footer .flex-spacer { flex: 1; }

    .composer-hint {
      margin: 8px 0 0;
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-faint);
      opacity: 0.8;
    }

    #sendBtn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #D9753E, #A85526);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(193, 101, 46, 0.45);
      transition: background 0.2s, transform 0.15s, opacity 0.2s, box-shadow 0.25s;
    }

    #sendBtn svg { width: 17px; height: 17px; }
    #sendBtn:hover { background: var(--accent-deep); transform: translateY(-1px); }
    #sendBtn:active { transform: scale(0.94); }
    #sendBtn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    #sendBtn.ready { background: var(--accent-deep); box-shadow: 0 4px 18px rgba(193, 101, 46, 0.45); }

    #sendBtn:focus-visible {
      outline: 2px solid #D9753E;
      outline-offset: 2px;
    }

    /* ---------- Cartes de suggestions ---------- */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 680px;
      width: 100%;
      margin: 22px auto 0;
    }

    .card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: var(--radius-md);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .card::after {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 0;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.35s ease;
    }

    .card:hover::after, .card:focus-visible::after { transform: scaleX(1); }

    .card:hover {
      background: rgba(255, 255, 255, 0.075);
      border-color: rgba(193, 101, 46, 0.45);
      transform: translateY(-2px);
    }

    .card:active { transform: translateY(0); }

    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .card-head svg { width: 16px; height: 16px; color: #D9753E; flex: 0 0 auto; }

    .card p {
      display: none;
    }

    /* ---------- Conversation ---------- */
    #chat {
      display: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(193, 101, 46, 0.35) transparent;
    }

    #chat::-webkit-scrollbar { width: 8px; }
    #chat::-webkit-scrollbar-thumb {
      background: rgba(193, 101, 46, 0.35);
      border-radius: 8px;
    }

    body[data-view="chat"] #hero { display: none; }
    body[data-view="chat"] .cards { display: none; }
    body[data-view="chat"] #chat { display: block; }
    body[data-view="chat"] .composer {
      max-width: 760px;
      margin-top: 12px;
    }
    body[data-view="chat"] textarea { min-height: 52px; }

    .msg {
      max-width: 78%;
      margin: 14px 0;
      padding: 12px 16px;
      border-radius: var(--radius-lg);
      line-height: 1.55;
      font-size: 0.93rem;
      animation: msgIn 0.22s ease both;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg .who {
      display: block;
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      margin-bottom: 5px;
      color: var(--text-faint);
    }

    .msg .body { white-space: pre-wrap; overflow-wrap: anywhere; }

    .msg.user {
      margin-left: auto;
      background: #C1652E;
      border: 1px solid rgba(193, 101, 46, 0.4);
      border-bottom-right-radius: 6px;
      color: #FDF3EC;
    }

    .msg.assistant {
      margin-right: auto;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
      color: var(--text);
    }

    .msg.assistant .who { color: #D9753E; }

    .msg.error {
      margin-right: auto;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-bottom-left-radius: 6px;
      color: #F5DEB8;
    }

    .msg.error .who { color: #F59E0B; }

    .system-note {
      margin: 10px 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-faint);
    }

    .system-note.loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .dots { display: inline-flex; gap: 5px; }

    .dots i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotPulse 1.1s ease-in-out infinite;
    }

    .dots i:nth-child(2) { animation-delay: 0.18s; background: #D9753E; }
    .dots i:nth-child(3) { animation-delay: 0.36s; background: #7A5844; }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    /* ---------- Splash d'ouverture (GSAP) ---------- */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      background:
        radial-gradient(700px 500px at 50% 42%, rgba(193, 101, 46, 0.14), transparent 65%),
        #050403;
      cursor: pointer;
    }

    .splash-center { display: grid; place-items: center; }
    .splash-mask { width: min(46vw, 190px); height: auto; overflow: visible; }

    .splash-word {
      margin-top: 24px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--text-dim);
      opacity: 0;
      transform: translateY(10px);
    }

    /* ---------- Panneau d'historique ---------- */
    #historyPanel {
      position: absolute;
      top: 0;
      left: 86px;
      bottom: 0;
      width: 320px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      background: linear-gradient(180deg, #131312, #0c0c0b);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 24px 0 60px rgba(0, 0, 0, 0.5);
      transform: translateX(-115%);
      visibility: hidden;
      transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 0.32s;
    }

    #historyPanel.open {
      transform: translateX(0);
      visibility: visible;
      transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s;
    }

    .hp-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .hp-tabs {
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      padding: 3px;
    }

    .hp-tab {
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-faint);
      background: transparent;
      border: none;
      border-radius: 999px;
      padding: 5px 11px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    }

    .hp-tab.active {
      color: #fff;
      background: linear-gradient(180deg, rgba(193, 101, 46, 0.45), rgba(193, 101, 46, 0.25));
      box-shadow: 0 0 10px rgba(193, 101, 46, 0.35);
    }

    .hp-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-faint);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .hp-icon svg { width: 15px; height: 15px; }
    .hp-icon:hover { background: rgba(255, 255, 255, 0.07); color: var(--text); }

    #hpNew {
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    #hpNew:hover { background: var(--accent-deep); }
    #hpNew:active { transform: scale(0.98); }

    .hp-view {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .hp-search, .hp-add input {
      font-family: inherit;
      width: 100%;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.8rem;
      transition: border-color 0.2s;
    }

    .hp-search { margin-bottom: 10px; }
    .hp-search:focus, .hp-add input:focus {
      outline: none;
      border-color: rgba(193, 101, 46, 0.5);
    }

    .hp-search::placeholder, .hp-add input::placeholder { color: var(--text-faint); }

    .hp-add {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .hp-add input { flex: 1; min-width: 0; }

    .hp-add button {
      flex: 0 0 auto;
      width: 34px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #D9753E, #A85526);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(193, 101, 46, 0.35);
      transition: transform 0.15s, box-shadow 0.2s;
    }

    .hp-add button:active { transform: scale(0.95); }
    .hp-add button:hover { box-shadow: 0 0 14px rgba(193, 101, 46, 0.5); }

    .hp-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 2px;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(193, 101, 46, 0.3) transparent;
    }

    #hpNew + .hp-list, .hp-search + #hpNew + .hp-list { margin-top: 14px; }

    .hp-item {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      transition: background 0.2s, border-color 0.2s;
    }

    .hp-item:hover { background: rgba(255, 255, 255, 0.055); border-color: var(--line-strong); }
    .hp-item.active { border-color: rgba(193, 101, 46, 0.6); background: rgba(193, 101, 46, 0.1); }

    .hp-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-align: left;
      padding: 10px 6px 10px 12px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-family: inherit;
      cursor: pointer;
    }

    .hp-name {
      font-size: 0.83rem;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hp-meta { font-size: 0.68rem; color: var(--text-faint); }

    .hp-del {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      margin-right: 6px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-faint);
      cursor: pointer;
      opacity: 0.55;
      transition: background 0.2s, color 0.2s, opacity 0.2s;
    }

    .hp-del svg { width: 14px; height: 14px; }
    .hp-del:hover { background: rgba(245, 158, 11, 0.14); color: #F59E0B; opacity: 1; }

    .hp-empty {
      font-size: 0.8rem;
      color: var(--text-faint);
      text-align: center;
      padding: 22px 8px;
    }

    .plan-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: background 0.2s, border-color 0.2s;
    }

    .plan-item:hover { background: rgba(255, 255, 255, 0.055); border-color: var(--line-strong); }

    .plan-text {
      flex: 1;
      min-width: 0;
      font-size: 0.8rem;
      line-height: 1.45;
      color: var(--text-dim);
      overflow-wrap: anywhere;
    }

    .plan-date {
      display: block;
      font-size: 0.65rem;
      color: var(--text-faint);
      margin-top: 4px;
    }

    /* ---------- Indicateur de réflexion (GSAP) ---------- */
    .think-orb { width: 34px; height: 34px; flex: 0 0 auto; }
    .think-svg { width: 100%; height: 100%; display: block; }

    .think-label {
      font-size: 0.8rem;
      background: linear-gradient(90deg, var(--text-faint) 0%, #E8D9C4 50%, var(--text-faint) 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: thinkShimmer 1.8s linear infinite;
    }

    @keyframes thinkShimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Ecran de connexion (APP_PASSWORD) ---------- */
    #loginScreen {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      background: #000000;
      padding: 20px;
    }

    #loginScreen[hidden] { display: none; }

    .login-card {
      width: min(340px, 92vw);
      padding: 34px 28px 28px;
      text-align: center;
      background: linear-gradient(170deg, #131312, #0b0b0a);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    .login-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      border: 1px solid rgba(193, 101, 46, 0.4);
      box-shadow: 0 0 18px rgba(193, 101, 46, 0.25);
    }

    .login-title {
      margin: 14px 0 2px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .login-sub {
      margin: 0 0 18px;
      font-size: 0.78rem;
      color: var(--text-faint);
    }

    #loginForm { display: flex; flex-direction: column; gap: 10px; }

    #loginPassword {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: var(--text);
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #loginPassword:focus {
      outline: none;
      border-color: rgba(193, 101, 46, 0.65);
      box-shadow: 0 0 12px rgba(193, 101, 46, 0.25);
    }

    #loginBtn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 11px 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #D9753E, #A85526);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(193, 101, 46, 0.35);
      transition: transform 0.15s, box-shadow 0.2s;
    }

    #loginBtn:hover { box-shadow: 0 0 20px rgba(193, 101, 46, 0.55); }
    #loginBtn:active { transform: scale(0.98); }
    #loginBtn:disabled { opacity: 0.6; cursor: wait; }

    .login-error {
      margin: 12px 0 0;
      font-size: 0.78rem;
      color: #F59E0B;
    }

    #loginScreen.shake { animation: loginShake 0.35s ease; }

    @keyframes loginShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      55% { transform: translateX(6px); }
      80% { transform: translateX(-3px); }
    }

    @media (max-width: 760px) {
      .app {
        height: calc(100dvh - 20px);
        margin: 10px;
        padding-left: 0;
        flex-direction: column;
        gap: 10px;
        border-radius: 0;
      }

      .rail {
        flex: 0 0 auto;
        align-self: center;
        flex-direction: row;
        padding: 8px 12px;
        gap: 8px;
      }

      .rail-btn.active::before { display: none; }
      .rail-logo { margin-bottom: 0; margin-right: auto; }
      .rail-spacer { display: none; }

      .main { padding: 14px 14px 16px; }
      .msg { max-width: 92%; }

      /* Telephone : ecran d'accueil allegé */
      #hero { padding-top: clamp(8px, 3vh, 18px); }
      .hero-logo { width: 84px; height: 84px; margin-bottom: 14px; }
      .hero-greeting { font-size: 1.15rem; }
      .hero-title { font-size: 1.35rem; }
      .hero-sub, .composer-hint, .mini-chip { display: none; }
      .composer { margin-top: 14px; padding: 10px 10px 8px; }
      textarea { min-height: 50px; }

      /* Suggestions = pastilles horizontales scrollables (pas de blocs empiles) */
      .cards {
        display: flex;
        overflow-x: auto;
        gap: 8px;
        margin-top: 14px;
        padding-bottom: 4px;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
      }
      .cards::-webkit-scrollbar { display: none; }
      .card { flex: 0 0 auto; padding: 10px 13px; gap: 4px; scroll-snap-align: start; }
      .card-head { font-size: 0.8rem; white-space: nowrap; }
      .topbar { flex-wrap: wrap; }
      #historyPanel { left: 0; width: min(360px, 100%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      /* Etat initial des boucles permanentes (evite une position de fin decalee) */
      .main::before, .hero-title, .think-label {
        animation: none !important;
      }
    }
  </style>
</head>

      body.dataset.view = view;
      document.getElementById("navHome").classList.toggle("active", view === "home");
      document.getElementById("navChat").classList.toggle("active", view === "chat");
      if (view === "chat") chat.scrollTop = chat.scrollHeight;
      else input.focus();
    }

    function note(text) {
      const el = document.createElement("div");
      el.className = "system-note";
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    // Nettoyage : coupe les tweens GSAP pour éviter les fuites mémoire
    function removeLoading(el) {
      if (!el) return;
      if (el._tweens) el._tweens.forEach((t) => t.kill());
      el.remove();
    }

    function addLoading() {
      const el = document.createElement("div");
      el.className = "system-note loading";

      const label = document.createElement("span");
      label.className = "think-label";
      label.textContent = "Réflexion en cours";

      if (!hasGsap || reducedMotion) {
        // Repli CSS simple (3 points) si GSAP absent ou animations réduites
        const dots = document.createElement("span");
        dots.className = "dots";
        dots.setAttribute("aria-hidden", "true");
        for (let i = 0; i < 3; i++) dots.appendChild(document.createElement("i"));
        label.textContent = "Analyse en cours";
        el.appendChild(dots);
        el.appendChild(label);
      } else {
        const orb = document.createElement("span");
        orb.className = "think-orb";
        orb.setAttribute("aria-hidden", "true");
        orb.innerHTML = THINK_SVG;
        el.appendChild(orb);
        el.appendChild(label);

        const particles = orb.querySelector(".think-particles");
        const mask = orb.querySelector(".think-mask");
        // Rotation continue de l'orbite + respiration douce du masque
        el._tweens = [
          gsap.to(particles, { rotation: 360, svgOrigin: "70 70", duration: 2.6, ease: "none", repeat: -1 }),
          gsap.to(mask, { scale: 1.07, svgOrigin: "70 70", duration: 0.8, yoyo: true, repeat: -1, ease: "sine.inOut" }),
          gsap.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.3 })
        ];
      }

      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    function addMessage(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;

      const who = document.createElement("span");
      who.className = "who";
      who.textContent = role === "user" ? "Vous" : role === "error" ? "Erreur" : "FasoFree";

      const content = document.createElement("div");
      content.className = "body";
      content.textContent = text;

      el.appendChild(who);
      el.appendChild(content);
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function enterChat() {
      if (!started) {
        started = true;
        setView("chat");
      }
    }

    function showLogin() {
      loginScreen.hidden = false;
      loginPassword.focus();
    }

    async function loadStatus() {
      try {
        const res = await fetch("/api/status");
        if (res.status === 401) {
          // Serveur protégé par APP_PASSWORD : on bloque derrière l'écran de connexion
          showLogin();
          return;
        }
        const data = await res.json();
        if (!data.hasApiKey) {
          statusEl.textContent = "Cle API manquante (.env)";
          statusEl.className = "ko";
          statusEl.hidden = false;
        } else if (!data.hasData) {
          statusEl.textContent = "fasofree-data.json absent";
          statusEl.className = "ko";
          statusEl.hidden = false;
        } else {
          // Tout est en ordre : pas de badge visible (le compteur a été retiré)
          statusEl.textContent = "";
          statusEl.className = "ok";
          statusEl.hidden = true;
        }
      } catch {
        statusEl.textContent = "Serveur injoignable";
        statusEl.className = "ko";
        statusEl.hidden = false;
      }
    }

    async function sendMessage() {
      if (sending) return;
      const message = input.value.trim();
      if (!message) return;

      sending = true;
      sendBtn.disabled = true;
      enterChat();
      addMessage("user", message);
      input.value = "";
      const loading = addLoading();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, conversationId: currentConvId })
        });
        const data = await res.json();
        removeLoading(loading);
        if (data.answer) {
          if (data.conversationId) currentConvId = data.conversationId;
          addMessage("assistant", data.answer);
          if (Array.isArray(data.memories) && data.memories.length) {
            const n = data.memories.length;
            note(
              n === 1
                ? "Ajouté au business plan : " + data.memories[0].content
                : n + " éléments ajoutés au business plan."
            );
          }
        } else {
          addMessage("error", data.error || "Reponse inconnue du serveur.");
        }
      } catch {
        removeLoading(loading);
        addMessage("error", "Serveur injoignable. Verifiez que « node server.js » tourne encore.");
      } finally {
        sending = false;
        sendBtn.disabled = false;
        input.focus();
        syncSendReady();
      }
    }

    async function resetChat() {
      currentConvId = null;
      chat.innerHTML = "";
      started = false;
      setView("home");
      note("Nouvelle conversation demarree.");
      closeHistory();
    }

    /* ---------- Historique des conversations ---------- */

    function formatDate(iso) {
      try {
        let s = String(iso || "").trim().replace(" ", "T");
        // PostgreSQL renvoie des microsecondes : on garde 3 chiffres max
        s = s.replace(/(\.\d{3})\d+/, "$1");
        // Date naive (SQLite/PG en UTC) → on interprète en UTC
        if (!/(Z|[+-]\d{2}:?\d{2})$/.test(s)) s += "Z";
        const d = new Date(s);
        if (Number.isNaN(d.getTime())) return String(iso || "");
        return d.toLocaleString("fr-FR", {
          day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
        });
      } catch {
        return String(iso || "");
      }
    }

    function showPanelTab(tab) {
      const isHist = tab !== "plan";
      tabHist.classList.toggle("active", isHist);
      tabPlan.classList.toggle("active", !isHist);
      tabHist.setAttribute("aria-selected", String(isHist));
      tabPlan.setAttribute("aria-selected", String(!isHist));
      viewHist.hidden = !isHist;
      viewPlan.hidden = isHist;
      if (isHist) renderHistory();
      else renderPlan();
    }

    function openHistory(tab) {
      historyPanel.classList.add("open");
      historyPanel.setAttribute("aria-hidden", "false");
      const isPlan = tab === "plan";
      document.getElementById("navHistory").classList.toggle("active", !isPlan);
      document.getElementById("navPlan").classList.toggle("active", isPlan);
      showPanelTab(isPlan ? "plan" : "hist");
    }

    function closeHistory() {
      historyPanel.classList.remove("open");
      historyPanel.setAttribute("aria-hidden", "true");
      document.getElementById("navHistory").classList.remove("active");
      document.getElementById("navPlan").classList.remove("active");
    }

    async function renderHistory() {
      hpList.replaceChildren();
      try {
        const res = await fetch("/api/conversations");
        const data = await res.json();
        const convs = Array.isArray(data.conversations) ? data.conversations : [];
        if (!convs.length) {
          const empty = document.createElement("p");
          empty.className = "hp-empty";
          empty.textContent = "Aucune conversation enregistrée.";
          hpList.appendChild(empty);
          return;
        }
        convs.forEach((c) => {
          const item = document.createElement("div");
          item.className = "hp-item" + (c.id === currentConvId ? " active" : "");

          const main = document.createElement("button");
          main.type = "button";
          main.className = "hp-main";
          const name = document.createElement("span");
          name.className = "hp-name";
          name.textContent = c.title || "Conversation";
          const meta = document.createElement("span");
          meta.className = "hp-meta";
          meta.textContent =
            formatDate(c.updated_at) + " · " + (c.messages || 0) +
            ((c.messages || 0) > 1 ? " messages" : " message");
          main.appendChild(name);
          main.appendChild(meta);
          main.addEventListener("click", () => openConversation(c.id));

          const del = document.createElement("button");
          del.type = "button";
          del.className = "hp-del";
          del.setAttribute("aria-label", "Supprimer la conversation");
          del.innerHTML =
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
          del.addEventListener("click", (e) => {
            e.stopPropagation();
            deleteConversation(c.id);
          });

          item.appendChild(main);
          item.appendChild(del);
          hpList.appendChild(item);
        });
      } catch {
        const err = document.createElement("p");
        err.className = "hp-empty";
        err.textContent = "Historique injoignable.";
        hpList.appendChild(err);
      }
    }

    async function openConversation(id) {
      if (sending) return;
      try {
        const res = await fetch("/api/conversations/" + id);
        if (!res.ok) return;
        const data = await res.json();
        currentConvId = data.conversation.id;
        chat.replaceChildren();
        (data.messages || []).forEach((m) => addMessage(m.role, m.content));
        started = true;
        setView("chat");
        closeHistory();
      } catch {}
    }

    async function deleteConversation(id) {
      if (sending) return;
      if (!confirm("Supprimer cette conversation ?")) return;
      try {
        await fetch("/api/conversations/" + id, { method: "DELETE" });
      } catch {}
      if (id === currentConvId) {
        currentConvId = null;
        chat.replaceChildren();
        started = false;
        setView("home");
      }
      renderHistory();
    }

    /* ---------- Business plan : mémoire de l'agent ---------- */

    async function renderPlan() {
      planList.replaceChildren();
      try {
        const res = await fetch("/api/memories");
        const data = await res.json();
        const items = Array.isArray(data.memories) ? data.memories : [];
        if (!items.length) {
          const empty = document.createElement("p");
          empty.className = "hp-empty";
          empty.textContent = "Aucune note. Dites « retiens que... » à l'agent ou ajoutez une note.";
          planList.appendChild(empty);
          return;
        }
        items.forEach((m) => {
          const item = document.createElement("div");
          item.className = "plan-item";

          const text = document.createElement("div");
          text.className = "plan-text";
          text.textContent = m.content;
          const date = document.createElement("span");
          date.className = "plan-date";
          date.textContent = formatDate(m.created_at);
          text.appendChild(date);

          const del = document.createElement("button");
          del.type = "button";
          del.className = "hp-del";
          del.setAttribute("aria-label", "Supprimer la note");
          del.innerHTML =
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
          del.addEventListener("click", () => deleteMemory(m.id));

          item.appendChild(text);
          item.appendChild(del);
          planList.appendChild(item);
        });
      } catch {
        const err = document.createElement("p");
        err.className = "hp-empty";
        err.textContent = "Business plan injoignable.";
        planList.appendChild(err);
      }
    }

    async function deleteMemory(id) {
      if (!confirm("Supprimer cette note du business plan ?")) return;
      try {
        await fetch("/api/memories/" + id, { method: "DELETE" });
      } catch {}
      renderPlan();
    }

    document.getElementById("planForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const value = planInput.value.trim();
      if (!value) return;
      planAdd.disabled = true;
      try {
        await fetch("/api/memories", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: value })
        });
        planInput.value = "";
        renderPlan();
      } catch {
        note("Ajout impossible : serveur injoignable.");
      } finally {
        planAdd.disabled = false;
        planInput.focus();
      }
    });

    // Filtre de recherche côté client sur les conversations
    hpSearch.addEventListener("input", () => {
      const q = hpSearch.value.trim().toLowerCase();
      hpList.querySelectorAll(".hp-item").forEach((item) => {
        const name = item.querySelector(".hp-name");
        const match = !q || (name && name.textContent.toLowerCase().includes(q));
        item.style.display = match ? "" : "none";
      });
    });

    composer.addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage();
    });

    document.getElementById("newChatBtn").addEventListener("click", resetChat);
    document.getElementById("navHome").addEventListener("click", () => setView("home"));
    document.getElementById("navChat").addEventListener("click", () => setView(started ? "chat" : "home"));
    document.getElementById("navRefresh").addEventListener("click", loadStatus);

    document.getElementById("navHistory").addEventListener("click", () => {
      const histVisible =
        historyPanel.classList.contains("open") && !viewHist.hidden;
      if (histVisible) closeHistory();
      else openHistory("hist");
    });

    document.getElementById("navPlan").addEventListener("click", () => {
      const planVisible =
        historyPanel.classList.contains("open") && !viewPlan.hidden;
      if (planVisible) closeHistory();
      else openHistory("plan");
    });

    tabHist.addEventListener("click", () => showPanelTab("hist"));
    tabPlan.addEventListener("click", () => showPanelTab("plan"));
    document.getElementById("hpClose").addEventListener("click", closeHistory);
    document.getElementById("hpNew").addEventListener("click", resetChat);

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeHistory();
    });

    // Clic hors panneau = fermeture
    document.addEventListener("click", (e) => {
      if (!historyPanel.classList.contains("open")) return;
      if (
        historyPanel.contains(e.target) ||
        e.target.closest("#navHistory") ||
        e.target.closest("#navPlan")
      )
        return;
      closeHistory();
    });

    document.querySelectorAll("[data-fill]").forEach((el) => {
      el.addEventListener("click", () => {
        input.value = el.getAttribute("data-fill");
        input.focus();
        syncSendReady();
      });
    });

    input.addEventListener("input", syncSendReady);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        // Entrée envoie, Maj+Entrée fait un retour à la ligne (comme tout chat)
        e.preventDefault();
        sendMessage();
      }
    });

    /* ---------- Splash d'ouverture (GSAP) ---------- */

    function finishSplash(splash) {
      if (!splash || splash.dataset.done) return;
      splash.dataset.done = "1";
      splash.remove();
    }

    function runSplash() {
      const splash = document.getElementById("splash");
      if (!splash) return;
      if (reducedMotion || !hasGsap) {
        finishSplash(splash);
        return;
      }

      const q = (sel) => splash.querySelector(sel);
      const disc = q(".s-disc");
      const ring = q(".s-ring");
      const arc = q(".s-arc");
      const eyes = splash.querySelectorAll(".s-eye");
      const nose = q(".s-nose");
      const mouth = q(".s-mouth");
      const glow = q(".s-glow");
      const word = q(".splash-word");

      // Préparation du tracé (stroke-dashoffset) pour les traits du masque
      [ring, arc, mouth].forEach((p) => {
        const len = p.getTotalLength();
        gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
      });
      gsap.set(disc, { scale: 0, transformOrigin: "50% 50%" });
      gsap.set(eyes, { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set(nose, { scale: 0, opacity: 0, transformOrigin: "50% 100%" });
      gsap.set(glow, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" });

      const tl = gsap.timeline({ onComplete: () => finishSplash(splash) });

      tl.to(disc, { scale: 1, duration: 0.55, ease: "back.out(1.6)" })
        .to(ring, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, "-=0.2")
        .to(arc, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, "-=0.5")
        .to(eyes, { scale: 1, opacity: 1, duration: 0.35, stagger: 0.1, ease: "back.out(2.4)" }, "-=0.25")
        .to(nose, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, "-=0.15")
        .to(mouth, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, "-=0.1")
        .to(glow, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, "-=0.35")
        .to(word, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, "-=0.25")
        .to({}, { duration: 0.45 })
        .to(splash, { opacity: 0, duration: 0.45, ease: "power1.inOut" })
        .add(() => revealContent());

      // Clic sur le splash = passer l'animation
      splash.addEventListener(
        "click",
        () => {
          tl.kill();
          finishSplash(splash);
          revealContent();
        },
        { once: true }
      );
    }

    function revealContent() {
      if (reducedMotion || !hasGsap) return;
      const app = document.querySelector(".app");
      gsap.fromTo(app, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" });
      const els = [".rail-logo", ".rail-btn", ".brand-name", ".topbar-right"];
      gsap.from(els, { opacity: 0, y: -8, duration: 0.4, stagger: 0.05, ease: "power2.out", clearProps: "all" });
      gsap.from("#hero > *", { opacity: 0, y: 16, duration: 0.5, stagger: 0.08, delay: 0.1, ease: "power2.out", clearProps: "all" });
      gsap.from(".composer, .composer-hint, .card", { opacity: 0, y: 18, duration: 0.45, stagger: 0.06, delay: 0.25, ease: "power2.out", clearProps: "all" });
    }

    /* ---------- Masque du hero : animation permanente (GSAP) ---------- */

    function runHeroAnimation() {
      const mask = document.querySelector(".hero-mask");
      if (!mask || reducedMotion || !hasGsap) return;

      const glow = document.querySelector(".hero-glow");
      const orbit = mask.querySelector(".hm-orbit");
      const halo = mask.querySelector(".hm-halo");
      const arc = mask.querySelector(".hm-arc");
      const eyes = mask.querySelectorAll(".hm-eye");
      const spark = mask.querySelector(".hm-spark");

      // Respiration douce du masque entier
      gsap.to(mask, {
        scale: 1.03, transformOrigin: "50% 50%",
        duration: 2.6, yoyo: true, repeat: -1, ease: "sine.inOut"
      });
      // Orbite lente des particules autour du visage (tour complet : 70s)
      gsap.to(orbit, { rotation: 360, svgOrigin: "70 70", duration: 70, repeat: -1, ease: "none" });
      // Halo qui pulse
      gsap.to(halo, { opacity: 0.3, duration: 2.4, yoyo: true, repeat: -1, ease: "sine.inOut" });
      gsap.to(glow, {
        opacity: 0.55, scale: 1.1, transformOrigin: "50% 50%",
        duration: 2.4, yoyo: true, repeat: -1, ease: "sine.inOut"
      });
      // L'arc dore qui vacille
      gsap.to(arc, { opacity: 0.45, duration: 1.9, yoyo: true, repeat: -1, ease: "sine.inOut" });
      // Clignement des yeux toutes les ~4s
      gsap.to(eyes, {
        scaleY: 0.12, transformOrigin: "50% 50%",
        duration: 0.09, repeat: -1, repeatDelay: 3.7, yoyo: true, ease: "power1.in"
      });

      // Etincelle qui tourne le long du contour du visage (boucle sans raccord)
      if (spark) {
        const len = spark.getTotalLength();
        const dash = 64;
        gsap.set(spark, { opacity: 1, strokeDasharray: dash + " " + len, strokeDashoffset: 0 });
        gsap.to(spark, { strokeDashoffset: -(dash + len), duration: 3.4, repeat: -1, ease: "none" });
      }
    }

    /* ---------- Bouton d'envoi : etat "pret" quand le champ est rempli ---------- */

    function syncSendReady() {
      sendBtn.classList.toggle("ready", !sending && input.value.trim().length > 0);
    }

    /* ---------- Connexion (APP_PASSWORD) ---------- */

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = loginPassword.value;
      if (!password) return;
      loginBtn.disabled = true;
      loginError.hidden = true;
      try {
        const res = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });
        if (res.ok) {
          location.reload();
          return;
        }
        const data = await res.json().catch(() => ({}));
        loginError.textContent = data.error || "Authentification refusée.";
        loginError.hidden = false;
        loginScreen.classList.remove("shake");
        void loginScreen.offsetWidth; // relance l'animation de secousse
        loginScreen.classList.add("shake");
        loginPassword.select();
      } catch {
        loginError.textContent = "Serveur injoignable.";
        loginError.hidden = false;
      } finally {
        loginBtn.disabled = false;
      }
    });

    loadStatus();
    runSplash();
    runHeroAnimation();
    syncSendReady();
  </script>
</body>
</html>
